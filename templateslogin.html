<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>과제 공유 게시판</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            background: #f4f6f8;

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .login-box {

            background: white;

            width: 90%;

            max-width: 350px;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.1);

            text-align: center;
        }


        .login-box h2 {

            margin-top: 0;

            margin-bottom: 10px;
        }


        .login-box p {

            color: #777;

            font-size: 14px;
        }


        .login-box input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #ddd;

            border-radius: 6px;

            margin-top: 10px;

            margin-bottom: 10px;

            font-size: 16px;
        }


        .login-box button {

            width: 100%;

            padding: 12px;

            background: #0066cc;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            font-size: 16px;
        }


        .login-box button:hover {

            background: #004c99;
        }


        .error {

            color: #ff4d4d !important;

            margin-top: 12px;
        }

    </style>
</head>


<body>


<div class="login-box">

    <h2>🔒 과제 공유 게시판</h2>

    <p>
        친구들에게 받은 비밀번호를 입력하세요.
    </p>


    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="비밀번호"
            autocomplete="current-password"
            required
            autofocus
        >


        <button type="submit">
            입장하기
        </button>

    </form>


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}

</div>


</body>
</html>
